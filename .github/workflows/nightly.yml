name: Nightly

on:
  schedule:
    # Every day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

# Cancel any in-progress nightly run if a new one is triggered
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:

  # ───────────────────────────────────────────────
  # 1. Build & archive (archives created inside each build workflow)
  # ───────────────────────────────────────────────
  build-linux:
    uses: ./.github/workflows/build-linux.yml

  build-windows:
    uses: ./.github/workflows/build-windows.yml

  build-macos:
    uses: ./.github/workflows/build-macos.yml

  # ───────────────────────────────────────────────
  # 2. Publish to the "nightly" GitHub Release
  # ───────────────────────────────────────────────
  # The macOS build does not block the release: the hosted macOS arm64 runners
  # are often saturated, and its job then fails without having started.
  publish-nightly:
    needs: [build-linux, build-windows, build-macos]
    if: >-
      !cancelled() &&
      needs.build-linux.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create/edit releases and push tags

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for changelog

      # linux-package, windows-package and macos-package when the macOS build succeeded
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: "*-package"
          merge-multiple: true
          path: dist

      # ── Metadata ────────────────────────────────
      - name: Compute release metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          BUILD_LABEL=$(date -u +%Y%m%d)-${SHORT_SHA}
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "full_sha=${FULL_SHA}" >> $GITHUB_OUTPUT
          echo "now=${NOW}" >> $GITHUB_OUTPUT
          echo "build_label=${BUILD_LABEL}" >> $GITHUB_OUTPUT

      # ── Ensure release exists ────────────────────
      - name: Ensure nightly release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view nightly --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create nightly \
              --repo "${{ github.repository }}" \
              --title "Nightly Build" \
              --notes "Nightly build — will be updated by CI." \
              --prerelease
          fi

      # ── Delete stale assets ──────────────────────
      - name: Delete existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
          | while read -r ASSET; do
              echo "  → Deleting asset: $ASSET"
              gh release delete-asset nightly "$ASSET" \
                --repo "$GITHUB_REPOSITORY" --yes
            done

      # ── Upload fresh assets ──────────────────────
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload nightly dist/* \
            --repo "${{ github.repository }}" \
            --clobber

      # ── Write release notes to file ──────────────
      - name: Write release notes
        run: |
          NOW="${{ steps.meta.outputs.now }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          BUILD_LABEL="${{ steps.meta.outputs.build_label }}"
          FULL_SHA="${{ steps.meta.outputs.full_sha }}"
          cat > nightly_release_notes.md << EOF
          > [!WARNING]
          > **Automated nightly build** from the \`develop\` branch. May be unstable.

          | | |
          |---|---|
          | Date   | ${NOW} |
          | Commit | [${SHORT_SHA}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
          | Branch | \`develop\` |

          ### Assets

          | File | Platform |
          |------|----------|
          | \`AliceVision-nightly-${BUILD_LABEL}-linux.tar.gz\` | Linux (Rocky 9, CUDA 12.8.0) |
          | \`AliceVision-nightly-${BUILD_LABEL}-windows.zip\`  | Windows (CUDA 13.2.1) |
          EOF
          # Optional: the macOS build does not block the release
          for ARCHIVE in dist/*-macos.tar.gz; do
            if [ -f "$ARCHIVE" ]; then
              echo "| \`$(basename "$ARCHIVE")\` | macOS (arm64, no CUDA) |" >> nightly_release_notes.md
            fi
          done
          for ARCHIVE in dist/*-macos-deps.tar.gz; do
            if [ -f "$ARCHIVE" ]; then
              echo "| \`$(basename "$ARCHIVE")\` | macOS dependencies, to extract in \`/Users/runner/work/AliceVision\` to build against the macOS archive |" >> nightly_release_notes.md
            fi
          done

      # ── Update release from file ──────────────────
      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit nightly \
            --repo "${{ github.repository }}" \
            --title "Nightly Build (${{ steps.meta.outputs.build_label }})" \
            --notes-file nightly_release_notes.md \
            --prerelease

      # ── Trigger downstream nightlies ─────────────
      # Projects building against these archives (space-separated "owner/repo" list,
      # token allowed to write their contents)
      - name: Trigger downstream nightlies
        if: vars.NIGHTLY_DISPATCH_REPOS != ''
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_DISPATCH_TOKEN }}
        run: |
          for REPO in ${{ vars.NIGHTLY_DISPATCH_REPOS }}; do
            gh api "repos/${REPO}/dispatches" -f event_type=alicevision-nightly
          done
